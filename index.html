<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f6f4a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Bird Monitor</title>
<style>
:root{--g:#1f6f4a;--g2:#e6f2ec;--bd:#d5dbd8;--bg:#f6f8f7;--tx:#1b2220;--mut:#66726d;--red:#b3261e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--g);color:#fff;padding:14px 16px;padding-top:max(14px,env(safe-area-inset-top))}
header h1{margin:0;font-size:20px}
header.sticky{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:12px}
header.sticky small{display:block;opacity:.9;font-size:13px}
main{padding:16px;max-width:640px;margin:0 auto}
label{display:block;font-weight:600;margin:0 0 14px}
label input,label select{display:block;width:100%;margin-top:6px;padding:12px;font-size:17px;border:1px solid var(--bd);border-radius:10px;background:#fff}
button{font:inherit;cursor:pointer}
.primary{width:100%;padding:16px;font-size:18px;font-weight:700;color:#fff;background:var(--g);border:0;border-radius:12px}
.end{background:#fff;color:var(--g);border:0;border-radius:10px;padding:10px 16px;font-weight:700}
h2{font-size:16px;margin:28px 0 8px;color:var(--mut)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#fff;border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.row small{color:var(--mut);display:block}
.row button,.link{background:none;border:1px solid var(--bd);border-radius:8px;padding:8px 10px}
.row .del{color:var(--red)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;background:#fff;border-bottom:1px solid var(--bd)}
.tabs button{flex:none;padding:8px 16px;border:1px solid var(--bd);border-radius:20px;background:#fff}
.tabs button.on{background:var(--g);color:#fff;border-color:var(--g)}
.tools{display:flex;gap:10px;align-items:center;padding:10px 12px}
.tools input[type=search]{flex:1;padding:11px;font-size:16px;border:1px solid var(--bd);border-radius:10px;background:#fff}
.chk{display:flex;align-items:center;gap:6px;margin:0;font-weight:500}
.chk input{width:20px;height:20px;margin:0}
#list{padding:0 12px 24px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sp{display:flex;background:#fff;border:1px solid var(--bd);border-radius:12px;overflow:hidden;min-height:64px}
.sp.hit{border-color:var(--g);background:var(--g2)}
.tap{flex:1;display:flex;justify-content:space-between;align-items:center;gap:6px;text-align:left;padding:10px 12px;background:none;border:0;font-size:16px;font-weight:600;touch-action:manipulation}
.tap:active{background:#cfe6da}
.tap b{font-size:22px;color:var(--g);min-width:1ch}
.minus{width:40px;border:0;border-left:1px solid var(--bd);background:none;font-size:22px;color:var(--mut)}
.minus:disabled{opacity:.25}
.addnew,.empty{grid-column:1/-1}
.addnew{padding:14px;border:2px dashed var(--g);background:#fff;color:var(--g);border-radius:12px;font-weight:700}
.empty{color:var(--mut);text-align:center}
.note{font-size:13px;color:var(--mut);margin-top:6px}
@media(min-width:700px){#list{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div id="app"><header><h1>Bird Monitor</h1></header><main>Loading…</main></div>
<script src="app.js"></script>
</body>
</html>
